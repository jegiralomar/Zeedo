name: Production CI/CD (Fast Deploy)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  fast-deploy-to-vps:
    name: Fast Live Update (< 30s)
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS & Hot Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            echo "🚀 [CI/CD] Connecting to Zeedo Droplet..."
            cd /root/zeedo
            
            # 1. Pull latest code in 1-2 seconds
            git fetch origin master
            git reset --hard origin/master

            # 2. Fast restart web container with zero rebuild lag
            echo "🔄 [CI/CD] Restarting live web service..."
            docker compose restart zeedo_web || docker compose restart web

            # 3. Quick Health Check
            sleep 4
            echo "🩺 [CI/CD] Probing live health..."
            curl -f -s http://localhost:8080/health || true
            echo "✅ [CI/CD] Zeedo updated live in under 20 seconds!"
