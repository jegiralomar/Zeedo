name: Production CI/CD (GHCR & VPS Deploy)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.repo_owner.outputs.lowercase }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Repository Owner to Lowercase
        id: repo_owner
        run: echo "lowercase=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Web & API Image
      - name: Build & Push Next.js Web Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin
          file: ./apps/admin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/zeedo-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push WebSocket Gateway Image
      - name: Build & Push WebSocket Container
        uses: docker/build-push-action@v5
        with:
          context: ./services/websocket
          file: ./services/websocket/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.lowercase }}/zeedo-websocket:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to DigitalOcean VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS & Update Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 [CI/CD] Connecting to Zeedo Production Host..."
            cd /root/zeedo
            
            # Fetch latest git commits
            git fetch origin master || git fetch origin main
            git reset --hard origin/master || git reset --hard origin/main

            # Pull pre-built images from GHCR
            echo "📦 [CI/CD] Pulling pre-built containers from GHCR..."
            docker compose pull web websocket

            # Zero-downtime hot reload
            echo "🔄 [CI/CD] Restarting services with new images..."
            docker compose up -d --no-deps web websocket

            # Wait for boot
            echo "⏳ [CI/CD] Waiting 8 seconds for health check..."
            sleep 8

            # Verify services
            docker compose ps
            
            echo "🩺 [CI/CD] Probing live health endpoint..."
            curl -f -s http://localhost:8080/health || (echo "❌ Health check failed!" && exit 1)
            
            echo "✅ [CI/CD] Zeedo deployed and healthy on zeedo.bid!"
