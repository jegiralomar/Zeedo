services:
  # 1. PostgreSQL Database (Local High-Performance NVMe Database)
  db:
    image: postgres:16-alpine
    container_name: zeedo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeedo_db_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-zeedodb}
    volumes:
      - zeedo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeedo_network

  # 2. Real-Time WebSocket Bidding Gateway
  websocket:
    image: ghcr.io/jegiralomar/zeedo-websocket:latest
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    container_name: zeedo_websocket
    restart: always
    environment:
      PORT: 8080
      WS_BROADCAST_SECRET: ${WS_BROADCAST_SECRET:-zeedo_internal_live_socket_key_9898}
      WEB_API_URL: http://web:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zeedo_network

  # 3. Next.js Web App & API
  web:
    image: ghcr.io/jegiralomar/zeedo-web:latest
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: zeedo_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-zeedo_db_secure_pass_2026}@db:5432/${POSTGRES_DB:-zeedodb}?sslmode=disable
      WS_GATEWAY_URL: http://websocket:8080
      WS_BROADCAST_SECRET: ${WS_BROADCAST_SECRET:-zeedo_internal_live_socket_key_9898}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://zeedo.bid/ws}
      SESSION_SECRET: ${SESSION_SECRET:-zeedo_production_session_jwt_secret_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WHATSAPP_TEMPLATE_NAME: ${META_WHATSAPP_TEMPLATE_NAME:-zeedo_auth_otp}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - zeedo_network

  # 4. Caddy Automatic SSL Reverse Proxy (Auto Let's Encrypt SSL)
  caddy:
    image: caddy:2-alpine
    container_name: zeedo_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-zeedo.bid}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.zeedo.bid}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - zeedo_caddy_data:/data
      - zeedo_caddy_config:/config
    depends_on:
      - web
      - websocket
    networks:
      - zeedo_network

  # 5. Self-Hosted Baileys WhatsApp Gateway (100% Free OTP Dispatch)
  whatsapp-gateway:
    image: ghcr.io/jegiralomar/zeedo-whatsapp:latest
    build:
      context: ./services/whatsapp
      dockerfile: Dockerfile
    container_name: zeedo_whatsapp
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
    volumes:
      - zeedo_whatsapp_auth:/app/auth_info
    networks:
      - zeedo_network

volumes:
  zeedo_pg_data:
  zeedo_caddy_data:
  zeedo_caddy_config:
  zeedo_whatsapp_auth:

networks:
  zeedo_network:
    driver: bridge
